<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad2" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="60%" stop-color="#0f5128"/>
      <stop offset="100%" stop-color="#083818"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="36" y="36" width="440" height="440" rx="115" ry="115" fill="url(#bgGrad2)" filter="url(#shadow2)"/>
  <rect x="36" y="36" width="440" height="440" rx="115" ry="115" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>

  <!-- Compass Ring with Directional Ticks -->
  <circle cx="256" cy="256" r="144" stroke="white" stroke-width="24" fill="none"/>
  <line x1="256" y1="84" x2="256" y2="104" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="408" x2="256" y2="428" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <line x1="84" y1="256" x2="104" y2="256" stroke="white" stroke-width="8" stroke-linecap="round"/>
  <line x1="408" y1="256" x2="428" y2="256" stroke="white" stroke-width="8" stroke-linecap="round"/>

  <!-- KBMDSI Chevron Emblem Inside -->
  <g transform="translate(256, 256) scale(2.4) translate(-33, -24.5)">
    <!-- Top Chevrons (Lime Green #84cc16 / #a3e635) -->
    <polygon points="12,4 30,19 23,24 5,9" fill="#a3e635" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="54,4 36,19 43,24 61,9" fill="#84cc16" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Bottom Chevrons (Teal / Dark Emerald #005C53) -->
    <polygon points="4,25 24,39 19,45 -1,31" fill="#005C53" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    <polygon points="62,25 42,39 47,45 67,31" fill="#0d9488" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
</svg>