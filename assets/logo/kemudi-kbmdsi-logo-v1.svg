<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad1" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#0E5A2F"/>
      <stop offset="100%" stop-color="#08381C"/>
    </linearGradient>
    <linearGradient id="limeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="tealGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Icon Squircle Background -->
  <rect x="36" y="36" width="440" height="440" rx="115" ry="115" fill="url(#bgGrad1)" filter="url(#shadow1)"/>
  <rect x="36" y="36" width="440" height="440" rx="115" ry="115" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>

  <!-- Outer Compass Circle -->
  <circle cx="256" cy="256" r="142" stroke="white" stroke-width="26" fill="none"/>

  <!-- Center Dynamic Chevron Compass Needle (KBMDSI Fusion) -->
  <g transform="translate(256, 256) rotate(45) translate(-256, -256)">
    <!-- Top Chevron Left Wing (Lime) -->
    <path d="M 230 145 L 256 195 L 244 235 L 210 185 Z" fill="url(#limeGrad1)" />
    <!-- Top Chevron Right Wing (Lime) -->
    <path d="M 282 145 L 256 195 L 268 235 L 302 185 Z" fill="#84cc16" />
    
    <!-- Bottom Chevron Left Wing (Teal/Emerald) -->
    <path d="M 210 327 L 244 277 L 256 317 L 230 367 Z" fill="#047857" />
    <!-- Bottom Chevron Right Wing (Teal/Emerald) -->
    <path d="M 302 327 L 268 277 L 256 317 L 282 367 Z" fill="url(#tealGrad1)" />

    <!-- Center Diamond Pivot (White) -->
    <polygon points="256,220 280,256 256,292 232,256" fill="white" />
  </g>
</svg>